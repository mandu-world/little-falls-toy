<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little Falls</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #1d2f2a;
  font-family: sans-serif;
}
canvas {
  display: block;
  touch-action: none;
}
#hint, #count {
  position: fixed;
  left: 12px;
  color: #cfe8e0;
  font-size: 14px;
  opacity: 0.8;
  pointer-events: none;
}
#hint { top: 10px; }
#count { top: 30px; }
</style>
</head>
<body>
<canvas id="falls"></canvas>
<div id="hint">Tap to put a stone. Tap a stone to take it away.</div>
<div id="count">splashes: 0</div>
<script src="falls.js"></script>
</body>
</html>
